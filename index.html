<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nong healjai</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Noto Sans Thai", sans-serif;
        color: #1f2933;
        background: #f7f4ef;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, 8vw, 84px);
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 520px;
        font-size: 20px;
        line-height: 1.6;
        color: #52616b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>nong healjai</h1>
      <p>พื้นที่เริ่มต้นสำหรับโปรเจกต์ที่ค่อย ๆ เติบโตอย่างใจเย็นและมีความหมาย</p>
    </main>
  </body>
</html>
